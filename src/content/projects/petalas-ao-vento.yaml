title: Pétalas ao Vento
order: 11
hook:
  pt: Ajude Rosa a guardar memórias preciosas no álbum de fotos.
  en: Help Rosa keep precious memories in her photo album.
synopsis:
  pt: >-
    Controle Rosa, uma senhora que sofreu uma perda e gostaria de reviver suas memórias preciosas. Acompanhe-a numa
    jornada melancólica, ao guardar fotos importantes em seu álbum.
  en: >-
    Play as Rosa, an elderly woman who has suffered a loss and wishes to relive her precious memories. Follow her on a
    melancholic journey as she keeps important photos in her album.
