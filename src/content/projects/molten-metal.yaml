title: Molten Metal
order: 1
featured: true
hook:
  pt: Sinta o ritmo dos tambores de guerra e o choque do aço. Acerte as marcações no tempo perfeito.
  en: Feel the rhythm of the war drums and the clashing sound of steel. Hit the marks in perfect timing.
synopsis:
  pt: >-
    No interior de uma montanha, onde ainda ecoam os sussurros dos antigos, o aço molda o destino dos guerreiros que se
    reúnem ali. Você é um artesão ancestral lendário, com a forja construída sob uma montanha colossal.
  en: >-
    Deep within a mountain, where the whispers of the ancients still echo, steel shapes the fate of the warriors who
    gather there. You are a legendary ancestral artisan, your forge built beneath a colossal mountain.
genre: { pt: Ritmo · Clicker · Roguelite, en: Rhythm · Clicker · Roguelite }
engine: Godot
studio: jam
context: { pt: GameJam Plus 2026/27 · etapa regional, en: GameJam Plus 2026/27 · regional stage }
year: 2026
status: released
deliverables: [soundtrack, sfx, voice, implementation]
role:
  pt: Criar a trilha sonora, os SFX e a voz original, além da implementação do áudio.
  en: Create the soundtrack, the SFX and the original voice, plus audio implementation.
soundNotes:
  pt:
    - Neste projeto, busquei compor uma trilha que evocasse um ambiente nórdico.
  en:
    - For this project, I aimed to compose a track that evoked a Nordic environment.
