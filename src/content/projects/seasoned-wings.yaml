title: 'Seasoned Wings: Magical Recipes'
altTitle: { pt: 'Asas Temperadas: Receitas Mágicas', en: 'Asas Temperadas: Receitas Mágicas' }
order: 6
hook:
  pt: Ukulele e flauta em Dó maior para uma taverna medieval e mágica.
  en: Ukulele and flute in C Major for a magical medieval tavern.
synopsis:
  pt: >-
    Seasoned Wings é um jogo de culinária num mundo de fantasia. Remi foi transportado magicamente para outro mundo por
    uma fada excêntrica e precisa coletar recursos, preparar receitas e servir os clientes antes que saiam da taverna.
  en: >-
    Seasoned Wings is a cooking game set in a fantasy world. The protagonist, Remi, was magically transported to another
    world by a quirky fairy, and must gather resources, prepare recipes, and serve customers before they leave the
    tavern.
genre: { pt: Culinária 3D, en: 3D cooking }
engine: Godot
studio: ufpel
context:
  pt: UFPel · Projeto Integrado III (jogo 3D com tutorial e foco em level design)
  en: UFPel · Integrated Project III (3D game with a tutorial, focused on level design)
year: 2025
status: released
deliverables: [soundtrack, voice, curation, mixing, 3d, animation, documentation]
role:
  pt: >-
    Produção da trilha sonora, curadoria de SFX, modelagem 3D da taverna e de alguns objetos, documentação e algumas
    animações (objetos e partículas). No teaser, cuidei da mixagem, da curadoria de efeitos, da gravação de voz e da
    composição.
  en: >-
    Soundtrack production, SFX curation, 3D modeling of the tavern and some objects, documentation, and some animations
    (such as for objects and particles). For the teaser, I handled audio mixing, sound effects curation, voice recording,
    and composition.
soundNotes:
  pt:
    - >-
      Gravei voz e música. Meu objetivo era criar uma atmosfera mágica e de fantasia que se misturasse à narrativa.
      Escolhi efeitos que evocassem magia e os sobrepus a sons de vento.
    - >-
      Na trilha, trabalhei em Dó maior, combinando ukulele e flauta para evocar um clima medieval. Também quis um som de
      "pedido pronto", e optei por algo parecido com um sino.
  en:
    - >-
      I recorded both voice and music. My goal was to create a magical and fantasy atmosphere to blend with the game's
      narrative. I chose effects that evoked magic and layered them with wind sounds.
    - >-
      For the soundtrack, I worked in C Major, pairing a ukulele with a flute to evoke a medieval feel. I also wanted a
      sound for "order ready," so I opted for something similar to a bell.
