title: Mathias Shooter
order: 7
hook:
  pt: Trilha alegre e nostálgica em Mi maior e SFX em 8 bits para um plataforma em pixel art.
  en: A cheerful, nostalgic E Major soundtrack and 8-bit SFX for a pixel art platformer.
synopsis:
  pt: >-
    Mathias Shooter é um jogo sobre um dinossauro que, com a namorada Mathilda, enfrenta inimigos. Neste plataforma,
    Mathias supera obstáculos para derrotar monstros assustadores!
  en: >-
    Mathias Shooter is a game about a dinosaur, along with his girlfriend Mathilda, facing off against enemies. This
    platformer game follows Mathias as he overcomes obstacles to defeat scary monsters!
genre: { pt: Plataforma, en: Platformer }
engine: Pyxel
studio: furg
context:
  pt: FURG · Algoritmos e Estruturas de Dados (Engenharia de Computação)
  en: FURG · Algorithms and Data Structures (Computer Engineering)
status: released
deliverables: [soundtrack, sfx, art, animation]
role:
  pt: Todos os assets criativos. Compus a trilha, criei toda a pixel art e produzi todas as animações.
  en: All creative assets. I composed the soundtrack, created all the pixel art, and produced all the animations.
soundNotes:
  pt:
    - >-
      Busquei um som alegre e nostálgico que combinasse com a pixel art. Compus a trilha em Mi maior, e os efeitos
      sonoros foram produzidos em 8 bits.
  en:
    - >-
      I wanted a cheerful and nostalgic sound to match the pixel art style. I composed the soundtrack in E Major, and the
      sound effects were produced in 8-bit.
team:
  - { name: Juliana Acunha }
  - { name: Pedro Caurio, role: { pt: Programação, en: Programming } }
