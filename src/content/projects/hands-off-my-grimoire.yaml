title: Hands Off My Grimoire!
order: 4
hook:
  pt: Proteja o grimório do seu mestre de invasores malignos.
  en: Protect your master's grimoire from evil invaders.
synopsis:
  pt: Em Hands Off My Grimoire, o jogador controla um pequeno goblin encarregado de proteger o grimório do seu mestre contra invasores.
  en: In Hands Off My Grimoire, the player controls a small goblin tasked with protecting its master's grimoire from invaders.
genre: { pt: Tower defense, en: Tower defense }
engine: Unity
studio: casulo-indie
context: { pt: Casulo Indie, en: Casulo Indie }
status: in-development
deliverables: [soundtrack, sfx]
role:
  pt: Criar a trilha sonora e os SFX.
  en: Create the soundtrack and the SFX.
soundNotes:
  pt:
    - Meu objetivo neste projeto foi compor uma trilha medieval e criar efeitos sonoros impactantes e imersivos.
  en:
    - My goal for this project was to compose a medieval soundtrack and design impactful, immersive sound effects.
