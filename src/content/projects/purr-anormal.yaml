title: 'Purr-Anormal: A Mystery in Paws'
order: 3
featured: true
hook:
  pt: Controle a Pudim enquanto investiga a casa assombrada.
  en: Control Pudim while investigating the haunted house.
synopsis:
  pt: >-
    Depois de uma grave crise financeira, uma gatinha chamada Pudim e sua família se mudam às pressas para uma mansão
    misteriosa. O único problema? O lugar já está ocupado por fantasmas! Explore a residência, resolva quebra-cabeças e
    descubra segredos do passado para acalmar os espíritos e encontrar um tesouro escondido capaz de mudar a vida da
    família para sempre.
  en: >-
    After a severe financial crisis, a little cat named Pudim and her family hastily move into a mysterious mansion. The
    only problem? The place is already occupied by ghosts! Explore the residence, solve puzzles, and uncover secrets from
    the past to appease the spirits and find a hidden treasure capable of changing your family's life forever.
engine: Unity
studio: casulo-indie
context: { pt: Casulo Indie, en: Casulo Indie }
status: in-development
deliverables: [soundtrack, sfx, voice]
role:
  pt: Criar a trilha sonora, criar os SFX e produzir a voz original.
  en: Create the soundtrack, create the SFX, and produce the original voice.
soundNotes:
  pt:
    - >-
      Meu objetivo neste projeto foi criar uma trilha assustadora e efeitos sonoros arrepiantes, combinando com o tema
      sem perder a fofura.
  en:
    - >-
      My goal with this project was to create a spooky soundtrack and haunting sound effects to match the theme while
      keeping it cute.
