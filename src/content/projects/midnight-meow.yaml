title: Midnight Meow
order: 2
featured: true
hook:
  pt: Uma trilha adaptativa em que as ondas de inimigos nascem conforme a tensão da música sobe.
  en: An adaptive soundtrack where enemy waves spawn as the music's tension rises.
synopsis:
  pt: >-
    Já se perguntou o que seu gato faz à noite? Em Midnight Meow, você joga como um gatinho que sai para defender a
    casa de ratos malvados.
  en: >-
    Have you ever wondered what your cat gets up to at night? In Midnight Meow, you play as a kitten venturing out to
    defend your home from evil rats.
genre: { pt: Tower defense · Shooter · Pinball, en: Tower defense · Shooter · Pinball }
engine: Unity
studio: jam
context: { pt: GameJam Plus 2025/26 · etapa regional, en: GameJam Plus 2025/26 · regional stage }
year: 2025
status: released
deliverables: [soundtrack]
role:
  pt: >-
    Produção da trilha sonora. Também produzi os temas de Menu, Créditos e Game Over. No tema de Game Over, quis evitar
    um tom punitivo, para que o jogador não se sentisse desencorajado.
  en: >-
    Soundtrack production. I also produced the Menu, Credits, and Game Over themes. For the Game Over track, I aimed to
    avoid a punishing tone, ensuring the player wouldn't feel discouraged.
soundNotes:
  pt:
    - >-
      No jogo, as ondas de inimigos são guiadas pelo áudio: elas aparecem conforme a tensão da música aumenta. Para isso,
      dividi a trilha em vários níveis de tensão distintos.
    - >-
      Quis que a trilha fizesse jus à Nyxie, nossa protagonista de cara emburrada. E, como os inimigos são ratos,
      incorporei à faixa sons que lembram ratos.
  en:
    - >-
      In the game, enemy waves are audio-driven. They spawn as the music's tension increases. To achieve this, I divided
      the soundtrack into several distinct tension levels.
    - >-
      I wanted the soundtrack to do justice to Nyxie, our grumpy-looking protagonist. Additionally, since the enemies are
      rats, I incorporated sounds reminiscent of them into the track.
